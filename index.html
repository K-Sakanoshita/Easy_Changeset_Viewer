<html lang="ja">

<head>
    <meta name="viewport"
        content="width=device-width, user-scalable=yes, initial-scale=1, maximum-scale=1, minimum-scale=1">
    <meta charset="utf-8" />
    <title>Easy Changeset Viewer(ver 2025/03/29)</title>
</head>
<link rel="shortcut icon" href="favicon.ico" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="./basic.css" />
<link rel="stylesheet" href="./lib/picker.min.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./lib/leaflet-hash.js"></script>
<script src="./lib/picker.min.js"></script>
<script src="./lib/basiclib.js"></script>
<script src="./lib/winlib.js"></script>
<script src="./lib/changeset.js"></script>
<script src="./lib/marker.js"></script>
<script src="./lib/mapper.js"></script>
<script src="./lib/osmtogeojson.js"></script>
<script src="./lib/leaflet-tilelayer-colorfilter.min.js"></script>
<script src="./lib/overpass.js"></script>
<script src="./easycs.js"></script>

<body>
    <header>
        <a href="https://github.com/K-Sakanoshita/Easy_Changeset_Viewer"><span>Easy Changeset Viewer</span></a>
        <span class="author"><a href="https://www.openstreetmap.org/user/K_Sakanoshita">by K.Sakanoshita</a></span>
    </header>
    <div id="mapid" class="mapid"></div>
    <div id="mMapid" class="mMapid"></div>
    <div id="detailLoading" class="detail-loading-overlay" role="status" aria-live="polite" hidden>
        <div class="detail-loading-panel">
            <span class="detail-spinner" aria-hidden="true"></span>
            <span>Loading changeset details...</span>
        </div>
    </div>
    <div id="details" class="details">
        <button id="detailsResizeHandle" class="details-resize-handle" type="button" role="separator"
            aria-label="Resize lower panel" aria-orientation="horizontal" aria-valuemin="0"
            aria-valuemax="100" aria-valuenow="25" title="Drag vertically to resize"></button>
        <div id="mappers"></div>
        <button id="mappersResizeHandle" class="mappers-resize-handle" type="button" role="separator"
            aria-label="Resize mapper list" aria-orientation="vertical" aria-valuemin="0"
            aria-valuemax="100" aria-valuenow="0" title="Drag horizontally to resize"></button>
        <div id="comments"></div>
    </div>
</body>

</html>
